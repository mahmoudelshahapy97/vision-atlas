name: vision-atlas

# Full stack: database + API (with the Vision Lab pipelines) + model server + console.
#
#   cp backend/.env.example backend/.env               once; then set JWT_SECRET
#   docker compose up --build                          everything
#   docker compose up -d postgres                      just the database
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   models on an NVIDIA GPU
#
# Models on another (GPU) server: run models-serve/docker-compose.yml there,
# put MODELS_URL=http://<gpu-host>:8500 in a .env next to this file and
# MODELS_TOKEN in backend/.env, then:  docker compose up -d --scale models=0
#
# Host ports are 5432 (Postgres), 8000 (API), 8080 (console) and 9000/9001
# (MinIO API/console). mediamtx (videos as RTSP streams) publishes no port. They are the same ports lost-found publishes by default,
# so only one of the two stacks can run at a time unless one is remapped.
#
# Images, videos and documents (lab inputs and outputs) are stored in MinIO;
# Postgres keeps each object's key and presigned link (media_object). Put the
# MinIO credentials in a .env next to this file (git-ignored):
#   MINIO_ROOT_USER=atlas
#   MINIO_ROOT_PASSWORD=<at least 8 characters>
#   MINIO_PUBLIC_URL=/    default: links go through the console (port 8080);
#                         or http://<this host>:9000 to load straight from MinIO

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # No ORM and no Alembic: schema.sql *is* the schema. Postgres runs these
      # once, on the first boot of an empty volume. seed.sql is the catalog the
      # app can't work without (90 projects), so unlike lost-found it is
      # mounted too. Reset with: docker compose down -v
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      # The rest (queries.sql, ...), readable inside the container for psql by hand.
      - ./database:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ./backend/.env
    environment:
      # Inside the compose network the database is always postgres:5432,
      # whatever backend/.env says for running outside Docker.
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      # The models container on the compose network, unless MODELS_URL is
      # set (in the shell or ./.env) to a model server elsewhere.
      MODELS_URL: ${MODELS_URL:-http://models:8500}
      # Object storage (minio service below). Presigned links are signed for
      # MINIO_PUBLIC_URL, the address browsers use, not minio:9000. The
      # default "/" makes them same-origin paths that web proxies to MinIO,
      # so browsers only need port 8080 (no 9000 forwarding).
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-atlas}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/}
      # Library videos are offered as rtsp://mediamtx:8554/files/... (empty: file: only).
      MEDIAMTX_URL: ${MEDIAMTX_URL-rtsp://mediamtx:8554}
    ports:
      - "8000:8000"
    volumes:
      - atlas-data:/data          # uploaded models; scratch for running labs
      - ./backend/logs:/app/logs
      # The workspaces' video libraries (camera-files/ws<id>/): uploaded in the
      # console, looped by cameras as file:<name> or through mediamtx as RTSP.
      - ./camera-files:/data/camera-files
    # Let a running pipeline write its result before the container stops.
    stop_grace_period: 30s
    # Runs and camera workers live in this process; one replica only.
    deploy:
      replicas: 1

  # Every model (YOLO26, YOLOE-26, SAM 2.1, EasyOCR, Real-ESRGAN, LaMa, MiDaS …)
  # behind one HTTP API; see models-serve/README.md. No host port: only the api
  # reaches it. The api doesn't depend_on it, so --scale models=0 works when
  # the models run on another server.
  models:
    build:
      context: ./models-serve
    restart: unless-stopped
    environment:
      DEVICE: cpu
      YOLO_SIZE: ${YOLO_SIZE:-n}   # n, s, m, l, x
      ALLOW_MODEL_DOWNLOADS: "true"
      MODELS_TOKEN: ${MODELS_TOKEN:-}
    volumes:
      # Downloaded weights and pushed custom models, as host files in models-serve/models.
      - ./models-serve/models:/app/models
    stop_grace_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
      - minio
    environment:
      # nginx.conf.template proxies /api, /media and the docs here,
      ATLAS_API_URL: http://api:8000
      # and presigned run files (/<bucket>/...) here.
      ATLAS_MINIO_URL: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-atlas}
    ports:
      - "8080:80"

  # Plays video files as looping RTSP streams, so a camera can run on a
  # recording (mediamtx/mediamtx.yml):
  #   rtsp://mediamtx:8554/street, rtsp://mediamtx:8554/fall   the lab samples
  #   rtsp://mediamtx:8554/files/ws<id>/<name>                 a workspace's library
  #                                                            (camera-files/, uploaded in the console)
  # Those URLs are resolved by the api container. No host port, so it can't
  # clash with anything on this machine; ffmpeg runs only while a camera reads.
  mediamtx:
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./backend/app/vision/samples:/videos/samples:ro
      - ./camera-files:/videos/files:ro

  # S3-compatible object storage for lab inputs and outputs (images, videos,
  # CSV/JSON/text downloads). Inside the network: http://minio:9000. Browsers
  # load files straight from it through presigned links, so the API port is
  # published. Web console: http://localhost:${MINIO_CONSOLE_HOST_PORT:-9001},
  # log in with MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from ./.env.
  #
  # MinIO no longer publishes community images, so this is Chainguard's build
  # from source, pinned by digest (the same one lost-found uses). To update,
  # pull cgr.dev/chainguard/minio:latest and copy the new digest here.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # The image ships mc but no curl/wget; "local" is mc's alias for
      # http://localhost:9000.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket (private), then exits. Re-running it is harmless.
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set atlas http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "atlas/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-atlas}
    restart: "no"

volumes:
  pgdata:
  atlas-data:
  miniodata:
