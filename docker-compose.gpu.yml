# NVIDIA GPU for the model server:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Needs the NVIDIA Container Toolkit on the host. The api stays on the CPU
# (pipelines, OpenCV, video); only the models container gets the GPU.
services:
  models:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    environment:
      DEVICE: cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
